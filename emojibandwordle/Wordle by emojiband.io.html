const VALID_GUESSES = [...WORDS];
let targetWord = '';
let currentRow = 0;
let currentCol = 0;
let gameOver = false;
let isAnimating = false;
let board = Array(6).fill(null).map(() => Array(5).fill(''));
let gameState = [];
let stats = { played: 0, wins: 0, currentStreak: 0, maxStreak: 0 };

function initGame() {
  loadStats();
  targetWord = WORDS[Math.floor(Math.random() * WORDS.length)];
  currentRow = 0; currentCol = 0; gameOver = false; isAnimating = false;
  board = Array(6).fill(null).map(() => Array(5).fill(''));
  gameState = [];
  renderBoard(); renderKeyboard();
}
function renderBoard() {
  const gameBoard = document.getElementById('gameBoard');
  gameBoard.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const row = document.createElement('div');
    row.className = 'row'; row.id = `row-${i}`;
    for (let j = 0; j < 5; j++) {
      const tile = document.createElement('div');
      tile.className = 'tile'; tile.id = `tile-${i}-${j}`;
      tile.textContent = board[i][j];
      if (board[i][j]) tile.classList.add('filled');
      row.appendChild(tile);
    }
    gameBoard.appendChild(row);
  }
}
function renderKeyboard() {
  const keyboard = document.getElementById('keyboard');
  const rows = [['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['ENTER','Z','X','C','V','B','N','M','BACK']];
  keyboard.innerHTML = '';
  rows.forEach(row => {
    const rowDiv = document.createElement('div'); rowDiv.className = 'keyboard-row';
    row.forEach(key => {
      const keyBtn = document.createElement('button');
      keyBtn.className = 'key'; keyBtn.textContent = key === 'BACK' ? '⌫' : key; keyBtn.id = `key-${key}`;
      if (key === 'ENTER' || key === 'BACK') keyBtn.classList.add('wide');
      keyBtn.onclick = () => handleKey(key);
      rowDiv.appendChild(keyBtn);
    });
    keyboard.appendChild(rowDiv);
  });
}
function handleKey(key) {
  if (gameOver || isAnimating) return;
  if (key === 'ENTER') submitGuess();
  else if (key === 'BACK') deleteLetter();
  else if (key.length === 1 && currentCol < 5) addLetter(key);
}
function addLetter(letter) {
  if (currentCol >= 5) return;
  board[currentRow][currentCol] = letter;
  const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
  tile.textContent = letter; tile.classList.add('filled'); currentCol++;
}
function deleteLetter() {
  if (currentCol <= 0) return;
  currentCol--; board[currentRow][currentCol] = '';
  const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
  tile.textContent = ''; tile.classList.remove('filled');
}
function submitGuess() {
  if (currentCol !== 5) { showToast('Not enough letters!'); shakeRow(currentRow); return; }
  const guess = board[currentRow].join('');
  if (!VALID_GUESSES.includes(guess)) { showToast('Not in word list!'); shakeRow(currentRow); return; }
  const result = checkGuess(guess);
  gameState.push({ guess, result });
  isAnimating = true;
  // Lock immediately if win or final loss
  if (guess === targetWord || currentRow === 5) gameOver = true;
  animateRow(currentRow, result);
  if (guess === targetWord) {
    setTimeout(() => { winGame(); isAnimating = false; }, 1800);
  } else if (currentRow === 5) {
    setTimeout(() => { loseGame(); isAnimating = false; }, 1800);
  } else {
    setTimeout(() => { currentRow++; currentCol = 0; isAnimating = false; }, 1800);
  }
}
function checkGuess(guess) {
  const result = Array(5).fill('absent');
  const targetChars = targetWord.split(''); const guessChars = guess.split('');
  for (let i = 0; i < 5; i++) { if (guessChars[i] === targetChars[i]) { result[i] = 'correct'; targetChars[i] = null; guessChars[i] = null; } }
  for (let i = 0; i < 5; i++) { if (guessChars[i] && targetChars.includes(guessChars[i])) { result[i] = 'present'; targetChars[targetChars.indexOf(guessChars[i])] = null; } }
  return result;
}
function animateRow(rowIdx, result) {
  const row = document.getElementById(`row-${rowIdx}`);
  const tiles = row.children;
  for (let i = 0; i < 5; i++) {
    setTimeout(() => { tiles[i].classList.add(result[i]); updateKeyboard(board[rowIdx][i], result[i]); }, i * 300);
  }
}
function updateKeyboard(letter, state) {
  const key = document.getElementById(`key-${letter}`); if (!key) return;
  if (state === 'correct') { key.classList.remove('present','absent'); key.classList.add('correct'); }
  else if (state === 'present' && !key.classList.contains('correct')) { key.classList.remove('absent'); key.classList.add('present'); }
  else if (state === 'absent' && !key.classList.contains('correct') && !key.classList.contains('present')) { key.classList.add('absent'); }
}
function shakeRow(rowIdx) {
  const row = document.getElementById(`row-${rowIdx}`); const tiles = row.children;
  for (let tile of tiles) { tile.classList.add('shake'); setTimeout(() => tile.classList.remove('shake'), 500); }
}
function showToast(message) {
  const toast = document.getElementById('toast'); toast.textContent = message; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000);
}
function winGame() {
  gameOver = true; stats.played++; stats.wins++; stats.currentStreak++; stats.maxStreak = Math.max(stats.maxStreak, stats.currentStreak); saveStats(); showEndModal(true);
}
function loseGame() {
  gameOver = true; stats.played++; stats.currentStreak = 0; saveStats(); showEndModal(false);
}
function showEndModal(won) {
  const modal = document.getElementById('endModal'); const title = document.getElementById('modalTitle'); const word = document.getElementById('modalWord');
  title.textContent = won ? 'YOU WON!' : 'GAME OVER'; word.textContent = targetWord;
  document.getElementById('played').textContent = stats.played;
  document.getElementById('winPercent').textContent = stats.played > 0 ? Math.round((stats.wins / stats.played) * 100) : 0;
  document.getElementById('currentStreak').textContent = stats.currentStreak;
  document.getElementById('maxStreak').textContent = stats.maxStreak;
  modal.classList.add('show');
}
function newGame() { document.getElementById('endModal').classList.remove('show'); initGame(); }
function shareResult() {
  let emoji = `Emoji Band Wordle\n${currentRow + 1}/6\n\n`;
  gameState.forEach(({ result }) => { result.forEach(r => { if (r === 'correct') emoji += '🟩'; else if (r === 'present') emoji += '🟨'; else emoji += '⬛'; }); emoji += '\n'; });
  if (navigator.clipboard) { navigator.clipboard.writeText(emoji); showToast('Copied to clipboard!'); }
}
function showRules() { document.getElementById('rulesModal').classList.add('show'); }
function closeRules() { document.getElementById('rulesModal').classList.remove('show'); }
function loadStats() { const saved = localStorage.getItem('pipesdle-stats'); if (saved) stats = JSON.parse(saved); }
function saveStats() { localStorage.setItem('pipesdle-stats', JSON.stringify(stats)); }
document.addEventListener('keydown', (e) => {
  if (gameOver || isAnimating) return;
  const key = e.key.toUpperCase();
  if (key === 'ENTER') handleKey('ENTER');
  else if (key === 'BACKSPACE') handleKey('BACK');
  else if (key.length === 1 && key >= 'A' && key <= 'Z') handleKey(key);
});
window.addEventListener('load', () => {
  initGame();
  if (!localStorage.getItem('pipesdle-played')) { setTimeout(showRules, 500); localStorage.setItem('pipesdle-played', 'true'); }
});
</script>
