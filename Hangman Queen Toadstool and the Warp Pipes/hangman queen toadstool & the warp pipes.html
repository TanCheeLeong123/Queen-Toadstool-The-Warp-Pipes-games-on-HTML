<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangman Queen Toadstool & The Warp Pipes</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="hangmanqtandtwp.css">
</head>
<body>
<div class="game-card">
  <div class="title">Hangman Queen Toadstool & The Warp Pipes</div>
  <div class="subtitle">Guess the word before 6 wrong guesses.</div>
  
  <div class="hangman-wrap">
    <svg class="hangman-svg" viewBox="0 200 200">
      <!-- Gallows -->
      <line x1="20" y1="180" x2="180" y2="180" class="hangman-part show" stroke="#8B4513" stroke-width="8"/>
      <line x1="50" y1="180" x2="50" y2="20" class="hangman-part show" stroke="#8B4513" stroke-width="8"/>
      <line x1="50" y1="20" x2="130" y2="20" class="hangman-part show" stroke="#8B4513" stroke-width="8"/>
      <line x1="130" y1="20" x2="130" y2="50" class="hangman-part show" stroke="#8B4513" stroke-width="4"/>
      
      <!-- Body parts -->
      <circle id="head" cx="130" cy="65" r="15" class="hangman-part" stroke="var(--mario-green)" fill="#43B047"/>
      <line id="body" x1="130" y1="80" x2="130" y2="130" class="hangman-part"/>
      <line id="armL" x1="130" y1="95" x2="110" y2="115" class="hangman-part"/>
      <line id="armR" x1="130" y1="95" x2="150" y2="115" class="hangman-part"/>
      <line id="legL" x1="130" y1="130" x2="115" y2="155" class="hangman-part"/>
      <line id="legR" x1="130" y1="130" x2="145" y2="155" class="hangman-part"/>
    </svg>
  </div>

  <div class="word-display" id="wordDisplay"></div>
  
  <div class="wrong-wrap">
    <div class="wrong-label">WRONG GUESSES:</div>
    <div class="wrong-letters" id="wrongLetters"></div>
  </div>
  
  <div class="lives">LIVES: <span id="livesCount">6</span></div>
  
  <div class="keyboard" id="keyboard"></div>
  
  <button class="btn" onclick="newGame()">NEW WORD</button>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-title" id="modalTitle">YOU WIN!</div>
    <div class="modal-word" id="modalWord">MARIO</div>
    <button class="btn" onclick="newGame(); closeModal()">PLAY AGAIN</button>
  </div>
</div>

<script>
const WORDS = [
  'MARIO', 'LUIGI', 'YOSHI', 'TOAD', 'TOADSTOOL', 'THE CUBE', 'YUNG RAJA', 'WARP', 'PIPE', 
  'FREDDIE MERCURY', 'BRIAN MAY', 'JOHN DEACON', 'ROGER TAYLOR', 'QUEEN', 'EMOJI', 'EMOJENA', 
  'TEXTOPOLIS', 'SANTA MARIA', 'PHILIPPINES', 'OSAKA', 'TOKYO', 'JAPAN', 'MANILA', 'BANGKOK', 
  'THAILAND', 'RAJAMANGALA', 'OSAKA STATION', 'TOKYO DOME', 'STADIUM NASIONAL', 'KUALA LUMPUR', 
  'MALAYSIA', 'PADANG', 'PADANG ATHLETICS FIELD', 'MARINA BAY', 'SINGAPORE', 'SECC OUTDOOR', 
  'HO CHI MINH CITY', 'VIETNAM', 'GOYANG STADIUM', 'GYEONGGI DO', 'SOUTH KOREA', 'GELORA BUNG KARNO', 
  'JAKARTA', 'INDONESIA', 'KAI TAK STADIUM', 'HONG KONG', 'TAIPEI DOME', 'TAIPEI', 'OMNI SPACE', 
  'BEIJING', 'TAIWAN', 'CHINA', 'POWER STARS', 'PLAZA FIFTY FIVE', 'YG ENTERTAINMENT', 'KPOP', 
  'SCORPION', 'SUB ZERO', 'GORO', 'MOTARO', 'CLINIC', 'EXIT', 'DIRECTORY', 'FRUIT THROWER', 
  'BALMAIN', 'IKEA', 'UNAGI', 'WALMART', 'SEPHORA', 'DEAD CICAK RADIO', 'HOUSE', 'ASIAN', 
  'OCEANIA', 'MCDONALDS', 'MR COCONUT', 'PROMOTION', 'MOCHI', 'HYUNG', 'MAKNAE', 'CONCERT', 
  'ONE UP LANTERN', 'EMOJI BAND', 'EMOJI BAND K', 'EMOJI BAND KOREAN BONG', 'PONDWAY', 
  'NISSAN STADIUM', 'NASHVILLE', 'FORD FIELD', 'DETROIT', 'US BANK STADIUM', 'MINNEAPOLIS', 
  'SOLDIER FIELD', 'CHICAGO', 'FLUSHING MEADOWS CORONA PARK', 'FLUSHING', 'MALL OF AMERICA', 
  'UNITED STATES OF AMERICA', 'OHIO STADIUM', 'COLUMBUS', 'ROGERS STADIUM', 'TORONTO', 
  'ROGERS ARENA', 'VANCOUVER', 'CANADA', 'BANORTE STADIUM', 'MEXICO CITY', 'MEXICO', 
  'PAPP LASZLO BUDAPEST SPORTARENA', 'BUDAPEST', 'HUNGARY', 'TOWER BRIDGE', 'LONDON', 
  'UTILITA ARENA', 'GLASGOW', 'CARDIFF', 'CO OP LIVE', 'MANCHESTER', 'UNITED KINGDOM', 
  'PALACIO VISTALEGRE', 'MADRID', 'SPAIN', 'THREE ARENA', 'DUBLIN', 'IRELAND', 'ZIGGO DOME', 
  'NETHERLANDS', 'BARCLAYS ARENA', 'HAMBURG', 'LANXESS ARENA', 'COLOGNE', 'OLYMPIASTADION BERLIN', 
  'BERLIN', 'GERMANY', 'FESTHALLE FRANKFURT', 'FRANKFURT', 'OLYMPIAHALLE', 'MUNICH', 
  'LOUVRE MUSEUM', 'FRANCE', 'PARIS', 'LOTTO ARENA', 'ANTWERP', 'BELGIUM', 'UNIPOL ARENA', 
  'ITALY', 'ROYAL ARENA', 'COPENHAGEN', 'DENMARK', 'AVICII ARENA', 'SWEDEN', 'ATLAS ARENA', 
  'LODZ', 'BOLEH', 'CHEEM', 'O TWO ARENA', 'PRAGUE', 'CZECH REPUBLIC', 'UNITY ARENA', 
  'OSLO', 'NORWAY', 'ARENA RIGA', 'RIGA', 'LATVIA', 'ZALGIRIO ARENA', 'KAUNAS', 'LITHUANIA', 
  'HALLENSTADION', 'ZURICH', 'SWITZERLAND', 'STADTHALLE', 'VIENNA', 'AUSTRIA', 'MEO ARENA', 
  'LISBON', 'PORTUGAL', 'DINAMO STADIUM', 'MINSK', 'BELARUS', 'ASIA', 'EUROPE', 'EUROPEAN', 
  'TEATRO COLISEO', 'SANTIAGO', 'CHILE', 'EL TEATRITO', 'BUENOS AIRES', 'ARGENTINA', 
  'SANTO ROCK BAR', 'SANTO ANDRE', 'BRAZIL', 'ESTADIO NACIONAL DE BRASILIA MANE GARRINCHA', 
  'BRASILIA', 'SOMOS ROCK FESTIVAL', 'SAO PAULO', 'CURITIBA', 'NORTH AMERICA', 'SOUTH AMERICA', 
  'BRUCE MASON', 'AUCKLAND', 'AUSTRALIA', 'FESTIVAL HALL', 'MELBOURNE', 'ESMORE THEATRE', 
  'SYDNEY', 'CANBERRA THEATRE CENTRE', 'CANBERRA', 'FORTITUDE', 'BRISBANE', 'MIZUHO PAYPAY DOME', 
  'FUKUOKA', 'OKINAWA WORLD', 'OKINAWA', 'ES CON FIELD HOKKAIDO', 'HOKKAIDO', 'SPRUNKIMAS', 
  'WORLD TOUR'
];

let word = '';
let guessed = [];
let wrong = [];
let lives = 6;
let gameOver = false;

const parts = ['head','body','armL','armR','legL','legR'];

function newGame() {
  word = WORDS[Math.floor(Math.random() * WORDS.length)];
  guessed = [];
  wrong = [];
  lives = 6;
  gameOver = false;
  
  document.getElementById('livesCount').textContent = lives;
  document.getElementById('wrongLetters').textContent = '';
  
  parts.forEach(p => document.getElementById(p).classList.remove('show'));
  
  renderWord();
  renderKeyboard();
  closeModal();
}

function renderWord() {
  const display = document.getElementById('wordDisplay');
  display.innerHTML = '';
  
  // Split into words first
  const words = word.split(' ');
  
  words.forEach((wordPart, wordIndex) => {
    const wordDiv = document.createElement('div');
    wordDiv.className = 'word';
    
    // Add each letter of this word
    for (let char of wordPart) {
      const slot = document.createElement('div');
      slot.className = 'letter-slot';
      slot.textContent = guessed.includes(char) ? char : '';
      wordDiv.appendChild(slot);
    }
    
    display.appendChild(wordDiv);
  });
}

function renderKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(letter => {
    const btn = document.createElement('button');
    btn.className = 'key';
    btn.textContent = letter;
    btn.onclick = () => guessLetter(letter);
    if (guessed.includes(letter) || wrong.includes(letter)) {
      btn.classList.add('used');
      btn.disabled = true;
      if (word.includes(letter)) btn.classList.add('correct');
      else btn.classList.add('wrong');
    }
    kb.appendChild(btn);
  });
}

function guessLetter(letter) {
  if (gameOver || guessed.includes(letter) || wrong.includes(letter)) return;
  
  if (word.includes(letter)) {
    guessed.push(letter);
    renderWord();
    renderKeyboard();
    
    // Win check ignores spaces
    if (word.split('').every(l => l === ' ' || guessed.includes(l))) {
      winGame();
    }
  } else {
    wrong.push(letter);
    lives--;
    document.getElementById('livesCount').textContent = lives;
    document.getElementById('wrongLetters').textContent = wrong.join(' ');
    document.getElementById(parts[6 - lives - 1]).classList.add('show');
    renderKeyboard();
    
    if (lives === 0) loseGame();
  }
}

function winGame() {
  gameOver = true;
  showModal('YOU WIN!', word);
}

function loseGame() {
  gameOver = true;
  // Reveal word
  guessed = word.split('');
  renderWord();
  showModal('GAME OVER', word);
}

function showModal(title, wordText) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalWord').textContent = wordText;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

document.addEventListener('keydown', e => {
  if (gameOver) return;
  const key = e.key.toUpperCase();
  if (key >= 'A' && key <= 'Z') guessLetter(key);
});

newGame();
</script>
</body>
</html>
